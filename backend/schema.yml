  /api/orders/:
    get:
      operationId: orders_list
      description: |-
        Checkout and order history for the authenticated customer.

        ``IsCustomer`` keeps staff accounts out of the storefront flow: an admin
        orders on behalf of someone else through the admin API, not by checking out
        under their own account.

        ``get_queryset`` is scoped to ``request.user``, which is the primary
        ownership control: another customer's order id yields 404 rather than 403,
        so the API never confirms that an id exists. ``IsOwner`` is layered on top
        as a second, explicit check on detail routes.
      summary: List my orders
      parameters:
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: payment_status
        schema:
          type: string
          enum:
          - failed
          - paid
          - pending
          - refunded
        description: |-
          * `pending` - Pending
          * `paid` - Paid
          * `failed` - Failed
          * `refunded` - Refunded
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - confirmed
          - delivered
          - pending
          - processing
          - shipped
        description: |-
          * `pending` - Pending
          * `confirmed` - Confirmed
          * `processing` - Processing
          * `shipped` - Shipped
          * `delivered` - Delivered
          * `cancelled` - Cancelled
      tags:
      - orders
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderListList'
          description: ''
    post:
      operationId: orders_create
      description: Converts the authenticated customer's cart into an order. Provide
        either `address_id` (a saved address) or an inline `shipping_address`. The
        subtotal, shipping cost and total are recomputed on the server - any price
        in the request body is ignored. Rejected with 400 when the cart is empty,
        a product was deactivated, or stock is insufficient. On success the cart is
        emptied and stock is decremented atomically.
      summary: Check out
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
            examples:
              SavedAddress:
                value:
                  address_id: 0f3d2b1a-9c4e-4a1b-8f7e-2d6c5b4a3e21
                summary: Saved address
              InlineAddress:
                value:
                  shipping_address:
                    full_name: Ada Lovelace
                    phone: '+15551234567'
                    address_line: 1 Analytical Engine Way
                    city: London
                    postal_code: EC1A 1BB
                    country: GB
                summary: Inline address
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
