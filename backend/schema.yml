        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - confirmed
          - delivered
          - pending
          - processing
          - shipped
        description: |-
          * `pending` - Pending
          * `confirmed` - Confirmed
          * `processing` - Processing
          * `shipped` - Shipped
          * `delivered` - Delivered
          * `cancelled` - Cancelled
      - in: query
        name: user
        schema:
          type: string
          format: uuid
      tags:
      - admin
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderList'
          description: ''
  /api/admin/orders/{id}/:
    get:
      operationId: admin_orders_retrieve
      description: Every order, with the status transition endpoint staff need.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this order.
        required: true
      tags:
      - admin
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/admin/orders/{id}/cancel/:
    post:
      operationId: admin_orders_cancel_create
      description: Staff forced cancellation. Returns reserved stock to inventory.
      summary: Cancel an order
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this order.
        required: true
      tags:
      - admin
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/admin/orders/{id}/status/:
    patch:
      operationId: admin_orders_status_partial_update
      description: Moves the order along the fulfilment state machine. Illegal transitions
        (for example `delivered` -> `pending`) return 400 and list the allowed targets.
      summary: Update an order status
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this order.
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrderStatusUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrderStatusUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrderStatusUpdateRequest'
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
components:
  schemas:
    Address:
      type: object
      description: A saved address (``public.addresses``).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user_id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          nullable: true
          maxLength: 150
        phone:
          type: string
          nullable: true
          maxLength: 32
        address_line:
          type: string
        city:
          type: string
          nullable: true
          maxLength: 120
        postal_code:
          type: string
          nullable: true
          maxLength: 32
        country:
          type: string
          nullable: true
          maxLength: 2
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address_line
      - created_at
      - id
      - updated_at
      - user_id
    AddressRequest:
      type: object
      description: A saved address (``public.addresses``).
      properties:
        full_name:
          type: string
          nullable: true
          maxLength: 150
        phone:
          type: string
          nullable: true
          maxLength: 32
        address_line:
          type: string
          minLength: 1
        city:
          type: string
          nullable: true
          maxLength: 120
        postal_code:
          type: string
          nullable: true
          maxLength: 32
        country:
          type: string
          nullable: true
          maxLength: 2
        is_default:
          type: boolean
      required:
      - address_line
    AdminProfile:
      type: object
      description: Staff view of a profile, including role assignment.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          title: Auth user id
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        full_name:
          type: string
          nullable: true
          maxLength: 150
        phone:
          type: string
          nullable: true
          maxLength: 32
        role:
          $ref: '#/components/schemas/UserRoleEnum'
        avatar_url:
          type: string
          nullable: true
        order_count:
          type: integer
          readOnly: true
        address_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address_count
      - created_at
      - email
      - id
      - order_count
      - updated_at
    AdminProfileRequest:
      type: object
      description: Staff view of a profile, including role assignment.
      properties:
        full_name:
          type: string
          nullable: true
          maxLength: 150
        phone:
          type: string
          nullable: true
          maxLength: 32
        role:
          $ref: '#/components/schemas/UserRoleEnum'
        avatar_url:
          type: string
          nullable: true
    Cart:
      type: object
      description: |-
        The authenticated customer's cart with server-computed totals.

        ``subtotal`` is summed from current catalogue prices and the shipping
        figures come from :class:`orders.services.ShippingService`, so the basket
        screen shows exactly what checkout will charge.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          readOnly: true
        total_items:
          type: integer
          readOnly: true
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        shipping_cost:
          type: string
          readOnly: true
        total:
          type: string
          readOnly: true
        free_shipping_threshold:
          type: string
          readOnly: true
        currency:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - currency
      - free_shipping_threshold
      - id
      - items
      - shipping_cost
      - subtotal
      - total
      - total_items
      - updated_at
    CartItem:
      type: object
      description: |-
        A cart line.

        Reads expose the nested product snapshot plus the server-computed money
        fields. Writes accept only ``product_id`` and ``quantity`` - a client can
        never state what a line costs.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        product:
          allOf:
          - $ref: '#/components/schemas/ProductSummary'
          readOnly: true
        quantity:
          type: integer
          maximum: 999
          minimum: 1
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        line_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        is_available:
          type: boolean
          readOnly: true
        available_quantity:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - available_quantity
      - created_at
      - id
      - is_available
      - line_total
      - product
      - unit_price
      - updated_at
    CartItemRequest:
      type: object
      description: |-
        A cart line.

        Reads expose the nested product snapshot plus the server-computed money
        fields. Writes accept only ``product_id`` and ``quantity`` - a client can
        never state what a line costs.
      properties:
        product_id:
          type: string
          format: uuid
          writeOnly: true
          description: Product to add. Required on create.
        quantity:
          type: integer
          maximum: 999
          minimum: 1
      required:
      - product_id
    Category:
      type: object
      description: |-
        Full category representation.

        ``name`` is not unique in the database, so two categories may share a name
        while keeping distinct slugs. Inactive categories are only visible to staff,
        which also prevents linking a public product to a hidden category.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
        is_active:
          type: boolean
        product_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - product_count
      - slug
      - updated_at
    CategoryRequest:
      type: object
      description: |-
        Full category representation.

        ``name`` is not unique in the database, so two categories may share a name
        while keeping distinct slugs. Inactive categories are only visible to staff,
        which also prevents linking a public product to a hidden category.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
        is_active:
          type: boolean
        image:
          type: string
          format: binary
          writeOnly: true
          nullable: true
          description: Optional image upload. Takes precedence over image_url.
      required:
