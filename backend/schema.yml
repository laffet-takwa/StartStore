    PatchedProfileRequest:
      type: object
      description: |-
        The profile returned by ``/api/auth/me/`` and embedded in a token response.

        ``role`` is read-only: privileges are granted by an administrator through
        ``PATCH /api/admin/users/{id}/``, never by a self-service update.
      properties:
        full_name:
          type: string
          nullable: true
          maxLength: 150
        phone:
          type: string
          nullable: true
          maxLength: 32
        avatar_url:
          type: string
          nullable: true
    PaymentStatusEnum:
      enum:
      - pending
      - paid
      - failed
      - refunded
      type: string
      description: |-
        * `pending` - Pending
        * `paid` - Paid
        * `failed` - Failed
        * `refunded` - Refunded
    Product:
      type: object
