    Profile:
      type: object
      description: |-
        The profile returned by ``/api/auth/me/`` and embedded in a token response.

        ``role`` is read-only: privileges are granted by an administrator through
        ``PATCH /api/admin/users/{id}/``, never by a self-service update.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          title: Auth user id
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        full_name:
          type: string
          nullable: true
          maxLength: 150
        phone:
          type: string
          nullable: true
          maxLength: 32
        role:
          allOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          readOnly: true
        avatar_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - role
      - updated_at
    ProfileRequest:
      type: object
      description: |-
        The profile returned by ``/api/auth/me/`` and embedded in a token response.

        ``role`` is read-only: privileges are granted by an administrator through
        ``PATCH /api/admin/users/{id}/``, never by a self-service update.
      properties:
        full_name:
          type: string
          nullable: true
          maxLength: 150
        phone:
          type: string
          nullable: true
          maxLength: 32
        avatar_url:
          type: string
          nullable: true
    RegisterRequest:
      type: object
      description: |-
        Self-service sign-up.

        The password is handed straight to Supabase Auth, which owns credentials and
        applies its own policy. Django keeps no copy.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 8
        full_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 32
        avatar_url:
          type: string
          maxLength: 1000
      required:
      - email
      - password
    ShippingAddressRequest:
      type: object
      description: |-
        A delivery destination.

        The column set mirrors ``public.addresses`` so an inline checkout address and
        a saved one produce the identical dictionary on ``orders.shipping_address``.
        ``address_line2`` and ``state`` are not part of the schema and are not accepted.
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: string
          minLength: 1
          maxLength: 32
        address_line:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
          maxLength: 120
        postal_code:
          type: string
          minLength: 1
          maxLength: 32
        country:
          type: string
          minLength: 2
          description: ISO 3166-1 alpha-2, e.g. GB.
          maxLength: 2
      required:
      - address_line
      - city
      - country
      - full_name
      - phone
      - postal_code
    UserRoleEnum:
      enum:
      - customer
      - admin
      type: string
      description: |-
        * `customer` - Customer
        * `admin` - Admin
    Wishlist:
      type: object
      description: |-
        A saved product, read representation.

        Entries are created and removed exclusively through
        ``POST /api/wishlist/toggle/`` and ``DELETE /api/wishlist/{product_id}/``,
        so no write fields are exposed here.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        product:
          allOf:
          - $ref: '#/components/schemas/ProductSummary'
          readOnly: true
        product_id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - product
      - product_id
    WishlistToggleRequest:
      type: object
      description: Body of ``POST /api/wishlist/toggle/``.
      properties:
        product_id:
          type: string
          format: uuid
          description: Id of the product to toggle.
      required:
      - product_id
    WishlistToggleResult:
      type: object
      description: Result of a toggle, so the frontend needs no follow-up request.
      properties:
        in_wishlist:
          type: boolean
        product_id:
          type: string
          format: uuid
        count:
          type: integer
      required:
      - count
      - in_wishlist
      - product_id
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    supabaseAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: auth
  description: Registration, login, token refresh and profile.
- name: addresses
  description: Saved shipping addresses.
- name: categories
  description: Product categories. Admin managed.
- name: products
  description: Catalogue. Public read, admin write.
- name: cart
  description: Authenticated shopper's cart.
- name: wishlist
  description: Authenticated shopper's wishlist.
- name: orders
  description: Checkout and order history.
- name: admin
  description: Staff only operations and reporting.
