          - $ref: '#/components/schemas/NullEnum'
        note:
          type: string
          writeOnly: true
          maxLength: 255
    PatchedProductImageRequest:
      type: object
      description: A gallery image. ``product`` comes from the URL, not the body.
      properties:
        image_url:
          type: string
          minLength: 1
        alt_text:
          type: string
          nullable: true
          maxLength: 200
        display_order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        image:
          type: string
          format: binary
          writeOnly: true
          nullable: true
          description: Optional image upload. Takes precedence over image_url.
    PatchedProductRequest:
      type: object
      description: |-
        Full catalogue representation, used for both list and detail responses.

        Foreign keys follow one convention across the API: **read nested, write by
        id**. ``category`` is the nested object on the way out; ``category_id`` is
        the accepted input key, and it may be omitted because the column is nullable.
        Prices are server owned - no field a client can send changes what a product
        costs at checkout.
      properties:
        category_id:
          type: string
          format: uuid
          writeOnly: true
          nullable: true
          description: Category id. Omit to leave the product uncategorised.
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        discount_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        stock:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        sku:
          type: string
          nullable: true
          description: Unique stock keeping unit. Stored uppercase.
          maxLength: 32
        image_url:
          type: string
          nullable: true
        is_active:
          type: boolean
        image:
          type: string
          format: binary
          writeOnly: true
          nullable: true
          description: Optional image upload. Takes precedence over image_url.
    PatchedProductStockUpdateRequest:
      type: object
      description: Payload for the staff stock adjustment endpoint.
      properties:
        stock:
          type: integer
          maximum: 1000000
          minimum: 0
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
