openapi: 3.0.3
info:
  title: StartStore API
  version: 1.0.0
  description: |-
    REST API for the StartStore e-commerce MVP.

    **Authentication** is a bearer token. Either sign in through `POST /api/auth/login/` (Supabase verifies the password, StartStore returns its own access/refresh pair) or send a Supabase access token directly. Refresh with `POST /api/auth/refresh/` and revoke with `POST /api/auth/logout/`.
paths:
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Creates the account in Supabase Auth and mirrors it into `public.profiles`
        with the `customer` role. No password is stored by Django. Returns the profile;
        the caller may sign in immediately unless email confirmation is enabled on
        the Supabase project.
      summary: Register an account
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
        '503':
          description: Supabase not configured.
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Supabase Auth verifies the password. On success StartStore returns
        its own short-lived `access` token plus a rotatable `refresh` token, along
        with the synced profile.
      summary: Obtain a token pair
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      - {}
      responses:
        '200':
          description: access, refresh and user profile.
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Rotate a refresh token and mint a new access token.
      summary: Refresh an access token
      tags:
      - auth
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - {}
      responses:
        '200':
          description: A new access token (and refresh token when rotation is on).
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklists the supplied refresh token. Send no body (or an empty
        `refresh`) to revoke every StartStore session. Including `supabase_access_token`
        also ends the GoTrue session.
      summary: Log out
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Read or update the authenticated profile.
      summary: Current profile
      tags:
      - auth
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    put:
      operationId: auth_me_update
      description: Read or update the authenticated profile.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: Only `full_name`, `phone` and `avatar_url` can be changed.
      summary: Update the current profile
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/addresses/:
    get:
      operationId: addresses_list
      description: Default address first. Filter with `?is_default=true` for just
        that one, or `?search=` across address line, city and postal code.
      summary: List my addresses
      parameters:
      - in: query
        name: city
        schema:
          type: string
      - in: query
        name: is_default
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - addresses
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAddressList'
          description: ''
    post:
      operationId: addresses_create
      description: The first address saved always becomes the default.
      summary: Save an address
      tags:
      - addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
            examples:
              Home:
                value:
                  full_name: Ada Lovelace
                  phone: '+15551234567'
                  address_line: 1 Analytical Engine Way
                  city: London
                  postal_code: EC1A 1BB
                  country: GB
                  is_default: true
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressRequest'
        required: true
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
              examples:
                Home:
                  value:
                    full_name: Ada Lovelace
                    phone: '+15551234567'
                    address_line: 1 Analytical Engine Way
                    city: London
                    postal_code: EC1A 1BB
                    country: GB
                    is_default: true
          description: ''
  /api/addresses/{id}/:
    get:
      operationId: addresses_retrieve
      description: |-
        The authenticated profile's address book.

        ``get_queryset`` is scoped to the owner, so another profile's address id
        resolves to 404 rather than 403.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Address id.
        required: true
      tags:
      - addresses
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    patch:
      operationId: addresses_partial_update
      description: |-
        The authenticated profile's address book.

        ``get_queryset`` is scoped to the owner, so another profile's address id
        resolves to 404 rather than 403.
      summary: Update an address
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Address id.
        required: true
      tags:
      - addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAddressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAddressRequest'
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    delete:
      operationId: addresses_destroy
      description: |-
        The authenticated profile's address book.

        ``get_queryset`` is scoped to the owner, so another profile's address id
        resolves to 404 rather than 403.
      summary: Delete an address
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Address id.
        required: true
      tags:
      - addresses
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      responses:
        '204':
          description: No response body
  /api/addresses/{id}/set-default/:
    post:
      operationId: addresses_set_default_create
      description: |-
        The authenticated profile's address book.

        ``get_queryset`` is scoped to the owner, so another profile's address id
        resolves to 404 rather than 403.
      summary: Make an address the default
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Address id.
        required: true
      tags:
      - addresses
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
  /api/categories/:
    get:
      operationId: categories_list
      description: Public. Inactive categories are only visible to staff.
      summary: List categories
      parameters:
      - in: query
        name: has_products
        schema:
          type: boolean
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - categories
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryList'
          description: ''
    post:
      operationId: categories_create
      description: |-
        Public catalogue navigation, admin managed taxonomy.

        * ``GET`` is open; inactive categories are hidden from non-staff callers.
        * ``POST``/``PATCH``/``DELETE`` require the ``admin`` role.
        * ``DELETE`` soft-deactivates instead of removing rows that historic orders
          still reference.
      summary: Create a category
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
        required: true
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/categories/{id}/:
    get:
      operationId: categories_retrieve
      description: |-
        Public catalogue navigation, admin managed taxonomy.

        * ``GET`` is open; inactive categories are hidden from non-staff callers.
        * ``POST``/``PATCH``/``DELETE`` require the ``admin`` role.
        * ``DELETE`` soft-deactivates instead of removing rows that historic orders
          still reference.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this category.
        required: true
      tags:
      - categories
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    patch:
      operationId: categories_partial_update
      description: |-
        Public catalogue navigation, admin managed taxonomy.

        * ``GET`` is open; inactive categories are hidden from non-staff callers.
        * ``POST``/``PATCH``/``DELETE`` require the ``admin`` role.
        * ``DELETE`` soft-deactivates instead of removing rows that historic orders
          still reference.
      summary: Update a category
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this category.
        required: true
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    delete:
      operationId: categories_destroy
      description: 'Soft delete: the row is flagged inactive so existing orders keep
        their history while the category disappears from the public catalogue. Products
        are left untouched.'
      summary: Deactivate a category
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this category.
        required: true
      tags:
      - categories
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      responses:
        '204':
          description: No response body
  /api/products/{product_id}/images/:
    get:
      operationId: products_images_list
      description: Gallery management for a single product (``admin`` only).
      summary: List a product's images
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: product_id
        schema:
          type: string
          format: uuid
        required: true
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - products
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductImageList'
          description: ''
    post:
      operationId: products_images_create
      description: Gallery management for a single product (``admin`` only).
      summary: Attach an image
      parameters:
      - in: path
        name: product_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductImageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductImageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductImageRequest'
        required: true
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductImage'
          description: ''
  /api/products/{product_id}/images/{id}/:
    get:
      operationId: products_images_retrieve
      description: Gallery management for a single product (``admin`` only).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: product_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - products
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductImage'
          description: ''
    patch:
      operationId: products_images_partial_update
      description: Gallery management for a single product (``admin`` only).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: product_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProductImageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProductImageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProductImageRequest'
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductImage'
          description: ''
    delete:
      operationId: products_images_destroy
      description: Gallery management for a single product (``admin`` only).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: product_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - products
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      responses:
        '204':
          description: No response body
  /api/products/:
    get:
      operationId: products_list
      description: |-
        The catalogue.

        * Public and customer requests read active products only.
        * Only admins may create, update or deactivate products.
        * ``DELETE`` soft-deactivates so order history keeps its references.
      summary: List products
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Category id or slug.
      - in: query
        name: in_stock
        schema:
          type: boolean
        description: Only products with stock available.
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: is_on_sale
        schema:
          type: boolean
        description: Only discounted products.
      - in: query
        name: max_price
        schema:
          type: number
          format: double
        description: Highest effective price, inclusive.
      - in: query
        name: min_price
        schema:
          type: number
          format: double
        description: Lowest effective price, inclusive.
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Comma separated fields. Allowed: name, -name, price, -price,
          discount_price, -discount_price, stock, -stock, created_at, -created_at.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Matches name, description or SKU.
      tags:
      - products
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
          description: ''
    post:
      operationId: products_create
      description: Admin only. Price, stock and visibility are all server owned.
      summary: Create a product
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductRequest'
        required: true
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/products/{id}/:
    get:
      operationId: products_retrieve
      description: |-
        The catalogue.

        * Public and customer requests read active products only.
        * Only admins may create, update or deactivate products.
        * ``DELETE`` soft-deactivates so order history keeps its references.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this product.
        required: true
      tags:
      - products
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    patch:
      operationId: products_partial_update
      description: |-
        The catalogue.

        * Public and customer requests read active products only.
        * Only admins may create, update or deactivate products.
        * ``DELETE`` soft-deactivates so order history keeps its references.
      summary: Update a product
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this product.
        required: true
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProductRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProductRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProductRequest'
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    delete:
      operationId: products_destroy
      description: Soft delete. The row survives so historic orders stay intact.
      summary: Deactivate a product
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this product.
        required: true
      tags:
      - products
      security:
      - bearerAuth: []
      - supabaseAuth: []
      - bearerAuth: []
      - supabaseAuth: []
      responses:
        '204':
          description: No response body
  /api/products/{id}/stock/:
    patch:
