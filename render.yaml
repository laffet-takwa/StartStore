services:
  # PostgreSQL Database
  - type: pserv
    name: smartstore-db
    env: postgres
    plan: free
    region: frankfurt

  # Django Backend
  - type: web
    name: smartstore-backend
    env: python
    region: frankfurt
    buildCommand: |
      cd backend
      pip install -r requirements/production.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
    startCommand: |
      cd backend
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: smartstore-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://smartstore-frontend.onrender.com,http://localhost:5173"
      - key: STATIC_URL
        value: "/static/"
      - key: STATIC_ROOT
        value: "staticfiles"
      - key: MEDIA_URL
        value: "/media/"
      - key: MEDIA_ROOT
        value: "media"
      - key: JWT_ACCESS_TOKEN_LIFETIME_MINUTES
        value: "60"
      - key: JWT_REFRESH_TOKEN_LIFETIME_DAYS
        value: "7"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "STAR STORE <noreply@starstore.tn>"
    healthCheckPath: /api/
    autoDeploy: true